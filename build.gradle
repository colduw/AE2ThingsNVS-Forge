plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

group = "dev.technici4n"
version = "${ae2_things_version}"

repositories {
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations {
    localRuntimeOnly
    runtimeClasspath.extendsFrom localRuntimeOnly
}

dependencies {
    implementation "curse.maven:applied-energistics-2-223794:${ae2_version}"

    compileOnly "curse.maven:guideme-1173950:${guideme_version}"
    runtimeOnly "curse.maven:guideme-1173950:${guideme_version}"
}

sourceSets {
    main {
        resources {
            srcDir("src/generated/resources")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes(
                // This replaces "file.jarVersion" found in neoforge.mods.toml
                "Implementation-Version": version
        )
    }
}

neoForge {
    version = neoforge_version

    mods {
        ae2things {
            sourceSet project.sourceSets.main
        }
    }

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', "ae2things"
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', "ae2things"
            programArgument '--nogui'
        }

        data {
            serverData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', "ae2things", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}